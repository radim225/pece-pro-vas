<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stránka nenalezena · Péče PRO VÁS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preload" href="/fonts/ebgaramond-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ebgaramond-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/manrope-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#F4EBE0;--card:#FCF8F2;--ink:#372F28;--body:#635648;--muted:#6E6157;--accent:#96593F;--line:#EADBCA}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--body);font:400 16px/1.6 Manrope,system-ui,sans-serif;padding:32px 20px;text-align:center}
.brand{font:500 26px/1.1 "EB Garamond",serif;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.tag{font:700 11px/1 Manrope;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.rule{width:56px;height:1px;background:#C9B49E;margin:28px auto}
.code{font:500 14px/1 Manrope;letter-spacing:.2em;color:var(--muted)}
h1{font:500 clamp(30px,8vw,44px)/1.15 "EB Garamond",serif;color:var(--ink);margin:12px 0 12px}
h1 em{color:var(--accent)}
p{max-width:34ch;margin:0 auto 28px}
.btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font:700 15px/1 Manrope;text-decoration:none}
.btn.p{background:var(--accent);color:#fff}.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(min-width:600px){.btns{flex-direction:row;max-width:none;width:auto}}
</style>
</head>
<body>
<a class="brand" href="/">Péče PRO VÁS</a>
<div class="tag">Kosmetika · Karlín</div>
<div class="rule"></div>
<div class="code">CHYBA 404</div>
<h1>Tuhle stránku <em>nenajdeme</em></h1>
<p>Odkaz je možná starý nebo v něm je překlep. Na úvodní stránce najdete ceník i kontakt.</p>
<div class="btns">
<a class="btn p" href="/">Zpět na úvod</a>
<a class="btn s" href="tel:+420775502224">Zavolat 775 502 224</a>
</div>
</body>
</html>
