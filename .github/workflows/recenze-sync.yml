# Jednou týdně stáhne Google recenze a když se liší od webu, otevře PR.
# Nic nenasazuje: merge (= deploy) dělá vždy člověk. Ručně: Actions → Recenze sync → Run workflow.
# Předpoklad: Settings → Actions → General → „Allow GitHub Actions to create and approve pull requests“.
name: Recenze sync

on:
  schedule:
    - cron: "17 6 * * 1"   # pondělí 6:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: recenze-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhnout recenze
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        run: python3 scripts/recenze_sync.py

      - name: Otevřít nebo aktualizovat PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Recenze beze změny."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C recenze/auto
          git commit -am "Recenze: synchronizace z Google ($(date -u +%F))"
          git push -f origin recenze/auto
          if [ -z "$(gh pr list --head recenze/auto --state open --json number -q '.[].number')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head recenze/auto \
              --title "Recenze: nové recenze z Google" \
              --body "Automatická synchronizace (\`scripts/recenze_sync.py\`). Zkontroluj texty a jména, merge = deploy na živý web."
          fi
